# docker compose up --build  ->  http://localhost:3000 (seed: docker compose exec app npx tsx prisma/seed.ts)
services:
  db:
    image: postgres:17
    environment: { POSTGRES_USER: dispatch, POSTGRES_PASSWORD: dispatch, POSTGRES_DB: dispatch }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dispatch"], interval: 3s, retries: 20 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://dispatch:dispatch@db:5432/dispatch
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars
      SEED_PASSWORD: Dispatch#2026
volumes: { pgdata: {} }
